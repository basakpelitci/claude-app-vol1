# XcodeGen project spec — run `xcodegen generate` to produce Aura.xcodeproj.
# Keeping the project declarative avoids .pbxproj merge conflicts.
name: Aura
options:
  bundleIdPrefix: com.aura
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES

targets:
  Aura:
    type: application
    platform: iOS
    sources:
      - path: Aura
        excludes:
          - "Tests/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aura.healthos
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Aura uses your photo library so you can pin dream wardrobe items."

  AuraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Aura/Tests
    dependencies:
      - target: Aura

schemes:
  Aura:
    build:
      targets:
        Aura: all
    test:
      targets:
        - AuraTests
